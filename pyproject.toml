[project]
name = "coach-copilot"
version = "0.2.0"
description = "AI Powerlifting Coach"
requires-python = ">=3.11"

dependencies = [
    "langchain>=0.3.0",
    "langchain-ollama>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-chroma>=0.2.0",
    "langchain-community>=0.3.0",
    "chromadb>=0.5.0",
    "nicegui>=2.0.0",
    "pypdf>=5.0.0",
    "pydantic-settings>=2.0.0",
    "youtube-transcript-api>=0.6.0",
    "gspread>=6.0.0",
    "google-auth>=2.0.0",
    "langgraph>=0.2.0",
    "duckduckgo-search>=6.0.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
coach = "src.app:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
